name: CI

on:
  push:
    branches: [ "main", "dev" , "staging"]
  pull_request:
    branches: [ "main", "dev" , "staging"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Lint Code
        run: bun run lint

      - name: Build Project
        run: bun run build

      - name: Build Registry
        run: npx shadcn@latest build

      - name: Check registry output is committed
        run: |
          if ! git diff --quiet -- public/r; then
            echo "::error::public/r is out of date with registry.json. Run 'bun run registry:build' and commit the result."
            git diff --stat -- public/r
            exit 1
          fi

      - name: Check every registry item is installable
        run: bun scripts/check-registry.ts
