name: Welcome New Contributor

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'WatermelonCorp/watermellon-registry' &&
      contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'), github.event.pull_request.author_association)
    steps:
      - name: Welcome message
        uses: actions/github-script@v9
        with:
          script: |
            const creator = context.payload.pull_request.user.login;

            const message = `
            Welcome @${creator}! :tada: :watermelon:

            Thank you for opening your first pull request in **Watermelon UI Registry**!
            We are incredibly excited to see new contributions.

            Here are a few next steps while our maintainers review:
            - Make sure you've read our [Contributing Guide](https://github.com/WatermelonCorp/watermellon-registry/blob/main/CONTRIBUTING.md).
            - If this PR adds a _new component_, ensure you ran \`bun run registry:build\` and included the generated \`.json\` files.
            - Ensure all CI tests pass.

            We will review this PR as soon as possible. Thank you again! :rocket:
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message,
            });
